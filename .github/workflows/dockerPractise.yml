name: Playwright Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: playwright-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Playwright tests in Docker
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

          docker run --rm \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            playwright-ci

      - name: Preserve Playwright report
        if: always()
        run: |
          rm -rf /tmp/playwright-report
          mkdir -p /tmp/playwright-report
          cp -r playwright-report/. /tmp/playwright-report/

      - name: Publish report to gh-pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          git fetch origin gh-pages
          git checkout gh-pages

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          cp -r /tmp/playwright-report/. .

          git add .

          git commit -m "Update Playwright test report" || echo "No changes to commit"

          git push origin gh-pages